<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8f7"><title>الدروس | Darb</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-copy">دَرْب<small>منصتك التعليمية</small></span></a><span class="online-pill"><span class="online-dot"></span> متصلون الآن <strong id="onlineCount">0</strong></span></div></header>
  <main class="container page-main">
    <nav class="breadcrumb"><a href="index.html">الرئيسية</a><span aria-hidden="true">/</span><a id="subjectLink">المقرر</a><span aria-hidden="true">/</span><span>الدروس</span></nav>
    <section class="page-banner"><span class="eyebrow">تعلم خطوة بخطوة</span><h1 id="subjectTitle">الدروس</h1><p>اختر الدرس الذي تريد مراجعته أو حمّل ملفه للعودة إليه لاحقًا.</p></section>
    <div id="lessons" class="content-list"><div class="loading">جارٍ تحميل الدروس...</div></div>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span>دَرْب — تعلّمك، على طريقتك.</span><span>حقوق النشر 2026 Darb</span></div></footer>
  <script>
    const params = new URLSearchParams(location.search);
    const subject = params.get("subject") || "";
    document.getElementById("subjectTitle").textContent = subject ? "دروس " + subject : "جميع الدروس";
    document.getElementById("subjectLink").textContent = subject || "المقررات";
    document.getElementById("subjectLink").href = subject ? "subject.html?name=" + encodeURIComponent(subject) : "index.html";
    let userId = localStorage.getItem("darbUserId");
    if (!userId) { userId = "user-" + Date.now() + "-" + Math.random().toString(36).slice(2); localStorage.setItem("darbUserId", userId); }
    async function heartbeat() { try { await fetch("/api/online", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId})}); } catch {} }
    async function updateOnline() { try { const response = await fetch("/api/online"); const data = await response.json(); document.getElementById("onlineCount").textContent = data.count; } catch {} }
    function escapeHtml(value) { return String(value || "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]); }
    async function loadLessons() {
      const box = document.getElementById("lessons");
      try {
        const url = subject ? "/api/lessons/" + encodeURIComponent(subject) : "/api/lessons";
        const response = await fetch(url); const lessons = await response.json();
        if (!response.ok) throw new Error();
        if (!lessons.length) { box.innerHTML = '<div class="empty-state">لا توجد دروس مضافة لهذا المقرر حتى الآن.</div>'; return; }
        box.innerHTML = lessons.map(lesson => `<article class="content-card"><h2>${escapeHtml(lesson.title)}</h2><p>${escapeHtml(lesson.description)}</p><div class="content-actions">${lesson.file ? `<a class="button button-primary" href="${encodeURI(lesson.file)}" target="_blank" rel="noopener">فتح الدرس</a><a class="button button-outline" href="${encodeURI(lesson.file)}" download>تنزيل الملف</a>` : '<span class="hero-note">لا يوجد ملف مرفق</span>'}</div></article>`).join("");
      } catch { box.innerHTML = '<div class="empty-state">تعذر تحميل الدروس. حدّث الصفحة وحاول مرة أخرى.</div>'; }
    }
    heartbeat(); updateOnline(); loadLessons();
    setInterval(heartbeat, 10000); setInterval(updateOnline, 5000);
  </script>
</body>
</html>
